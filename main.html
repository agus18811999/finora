/* FINORA V2 — Financial Calendar */

.finora-calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 5px;
}

.cal-week {
  text-align: center;
  padding: 10px 2px;
  font-size: 11px;
  color: var(--muted);
}

.cal-cell {
  min-width: 0;
  min-height: 90px;
  padding: 9px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow: hidden;
  cursor: pointer;
}

.cal-cell small {
  display: block;
  font-size: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}

.cal-cell.cal-selected {
  outline: 2px solid var(--coral);
  background: var(--canvas);
}

.cal-cell.cal-out {
  opacity: .28;
  min-height: 40px;
  background: #faf6f7;
}

.cal-cell:hover {
  border-color: var(--coral);
}

@media(max-width: 600px) {
  .finora-calendar { gap: 2px; }
  .cal-cell { min-height: 73px; padding: 4px; }
  .cal-cell small { font-size: 9px; }
  .cal-week { font-size: 9px; }

  #finoraQuick {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 55;
    box-shadow: 0 12px 30px #ff334755;
  }
}

<script>
'use strict';
// Finora external SPA: Google Identity Services + cross-origin form POST + iframe postMessage.
// Never embed financial records or server secrets in the public HTML.
const FINORA_CONFIG=window.FINORA_CONFIG;
let finoraIdToken='';
const NAV=[['Overview',[['dashboard','◈','Dashboard'],['analytics','▥','Financial Analytics']]],['Money Management',[['transactions','⇄','Transactions'],['income','↙','Income'],['expenses','↗','Expenses'],['accounts','▣','Accounts & Wallets'],['pockets','◉','Money Pockets']]],['Financial Planning',[['budgets','▤','Budgets'],['goals','◎','Savings Goals'],['investments','◫','Investments'],['debts','▦','Debts & Receivables']]],['Intelligence',[['health','♡','Financial Health'],['cashflow','⌁','Cash Flow'],['reports','▧','Reports']]],['System',[['recurring','↻','Recurring Rules'],['data','⬇','Import & Export'],['settings','⚙','Settings']]]];
NAV.find(x=>x[0]==='System')[1].push(['profile','◉','My Profile']);
const state={view:'dashboard',snap:null,period:'month',start:'',end:'',search:'',account:'all',category:'all',kind:'all',page:1,busy:false,charts:{},preview:null,modal:null};
const $=id=>document.getElementById(id), d=()=>state.snap?.data||{}, fin=()=>state.snap?.derived||{}, fmt=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID'), compact=n=>{const a=Math.abs(n);return a>=1e9?'Rp'+(n/1e9).toLocaleString('id-ID',{maximumFractionDigits:2})+' M':a>=1e6?'Rp'+(n/1e6).toLocaleString('id-ID',{maximumFractionDigits:2})+' jt':fmt(n)}, percent=n=>(Number(n)||0).toLocaleString('id-ID',{maximumFractionDigits:1})+'%', esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), num=x=>Number(x)||0;
const find=(table,id)=>((d()[table]||[]).find(x=>x.id===id)||{}), fullName=(table,id)=>find(table,id).name||id||'—';
const TODAY=()=>state.snap?.today||new Date().toISOString().slice(0,10), reqId=()=>('ui:'+Date.now()+':'+Math.random().toString(36).slice(2));
function parseISO(s){const [y,m,day]=String(s||TODAY()).slice(0,10).split('-').map(Number);return new Date(y,m-1,day)}
function dateISO(v){return [v.getFullYear(),String(v.getMonth()+1).padStart(2,'0'),String(v.getDate()).padStart(2,'0')].join('-')}
function dateAtOffset(offset){let dt=parseISO(TODAY());dt.setMonth(dt.getMonth()+offset);return dateISO(dt)}
function bounds(){const t=parseISO(TODAY()), y=t.getFullYear(),m=t.getMonth(),today=TODAY();let start,end=today;
  if(state.period==='day')start=today;
  else if(state.period==='week'){const x=new Date(t);x.setDate(x.getDate()-((x.getDay()+6)%7));start=dateISO(x)}
  else if(state.period==='month'){start=dateISO(new Date(y,m,1));end=dateISO(new Date(y,m+1,0))}
  else if(state.period==='quarter'){start=dateISO(new Date(y,Math.floor(m/3)*3,1));end=dateISO(new Date(y,Math.floor(m/3)*3+3,0))}
  else if(state.period==='year'){start=dateISO(new Date(y,0,1));end=dateISO(new Date(y,11,31))}
  else if(state.period==='all'){start='1900-01-01';end='2999-12-31'}
  else if(state.period==='custom'){start=state.start||today;end=state.end||today}
  return [start,end];}
function inBounds(date){const [a,b]=bounds();return String(date)>=a&&String(date)<=b}
function transactions(){
 const primary=(d().Transactions||[]).filter(x=>x.deleted!==true&&x.deleted!=='true');
 const interest=(d().DebtPayments||[]).filter(x=>num(x.interest)>0).map(x=>{const loan=find('DebtsReceivables',x.debtId);return {id:'interest:'+x.id,date:x.date,type:loan.kind==='receivable'?'income':'expense',amount:x.interest,accountId:x.accountId,toAccountId:'',categoryId:'',pocketId:'',description:'Bunga '+(loan.kind==='receivable'?'diterima':'dibayar')+' — '+loan.party,merchant:loan.party,tags:'interest',createdAt:x.createdAt,deleted:false,virtual:true}});
 return primary.concat(interest);
}
function filteredTx(){return transactions().filter(t=>inBounds(t.date)&&(state.account==='all'||t.accountId===state.account||t.toAccountId===state.account)&&(state.category==='all'||t.categoryId===state.category)&&(state.kind==='all'||t.type===state.kind)&&(!state.search||[t.description,t.merchant,fullName('Categories',t.categoryId),fullName('Accounts',t.accountId)].join(' ').toLowerCase().includes(state.search.toLowerCase()))).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.createdAt).localeCompare(String(a.createdAt)))}
function getSummary(){const arr=filteredTx();return {income:arr.filter(t=>t.type==='income').reduce((s,x)=>s+num(x.amount),0),expense:arr.filter(t=>t.type==='expense').reduce((s,x)=>s+num(x.amount),0),transactions:arr.length};}
function toast(message,fail=false){const el=document.createElement('div');el.className='toast '+(fail?'fail':'ok');el.textContent=message;$('toastStack').append(el);setTimeout(()=>el.remove(),4300)}
function setStatus(text,type='pending'){$('status').className='status '+type;$('status').querySelector('span').textContent=text}
function checkConfig(){
  const url=String(FINORA_CONFIG?.APPS_SCRIPT_URL||'').trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url))
    throw new Error('Set APPS_SCRIPT_URL pada index.html dan login.html (URL /exec).');
  if(location.origin==='null'||!/^https?:$/.test(location.protocol))
    throw new Error('Buka melalui Live Server atau hosting HTTPS, bukan file://.');
  return url;
}
const FINORA_SESSION_KEY='FINORA_MULTI_SESSION_V1';
function finoraReadSession_(){
  try{return JSON.parse(sessionStorage.getItem(FINORA_SESSION_KEY)||'null');}catch{return null;}
}
function finoraSetSession_(s){sessionStorage.setItem(FINORA_SESSION_KEY,JSON.stringify(s));finoraIdToken=s.idToken;}
function finoraLogout_(){sessionStorage.removeItem(FINORA_SESSION_KEY);finoraIdToken='';location.replace('index.html');}
async function finoraEnsureSession_(){
  const session=finoraReadSession_();
  if(!session?.idToken||!session.refreshToken)throw new Error('Silakan login kembali.');
  if((session.expiresAt||0)<Date.now()+75000){
    const data=await rpc('authRefresh',{refreshToken:session.refreshToken});
    finoraSetSession_({...session,...data,expiresAt:Date.now()+(Number(data.expiresIn)||3600)*1000});
  }else finoraIdToken=session.idToken;
}
function finoraProfile_(){return (d().UserProfile||[])[0]||{};}
function finoraSyncIdentity_(){
  const profile=finoraProfile_(),session=finoraReadSession_()||{};
  const name=profile.name||session.name||session.email||'User';
  const btn=$('profileBtn');if(!btn)return;
  btn.title='Profil: '+name;
  btn.replaceChildren();
  const circle=document.createElement('span');circle.className='profile-top-avatar';
  if(/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(profile.photoData||'')){
    const img=document.createElement('img');img.src=profile.photoData;img.alt='Foto profil';
    img.style.cssText='height:100%;width:100%;object-fit:cover;border-radius:inherit';
    circle.append(img);
  }else circle.textContent=name.split(/\s+/).map(n=>n[0]).slice(0,2).join('').toUpperCase();
  const label=document.createElement('span');label.className='profile-top-name';
  label.textContent=name.length>24?name.slice(0,24)+'…':name;
  btn.append(circle,label);
}

function browserNonce(){
  const arr=new Uint8Array(16);crypto.getRandomValues(arr);
  return Array.from(arr,b=>b.toString(16).padStart(2,'0')).join('');
}
// Real POST, not fetch/no-cors. HTML-service response sends a verified
// postMessage to its allowed parent origin; no proxy or third source file.
async function rpc(action,payload={}){
  const scriptUrl=checkConfig();
  if(!/^auth(?:Refresh|Reset|Register|Login|ResendVerification)$/.test(action))await finoraEnsureSession_();
  const id='finora_'+browserNonce();
  return new Promise((resolve,reject)=>{
    const iframe=document.createElement('iframe');
    iframe.name=id;iframe.title='Finora API response';
    iframe.style.cssText='position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0';
    iframe.setAttribute('aria-hidden','true');
    const form=document.createElement('form');
    form.method='POST';form.action=scriptUrl;form.target=id;
    form.style.display='none';form.acceptCharset='UTF-8';
    function hidden(name,value){const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;form.appendChild(input)}
    hidden('requestId',id);
    hidden('replyOrigin',location.origin);
    hidden('request',JSON.stringify({action,payload,idToken:action==='authRefresh'?'':finoraIdToken}));
    let finished=false;
    const timer=setTimeout(()=>finish(new Error('Server tidak merespons dalam 90 detik. Periksa deployment, login, dan koneksi.')),90000);
    function finish(error,data){
      if(finished)return;finished=true;clearTimeout(timer);
      window.removeEventListener('message',onReply);
      setTimeout(()=>{iframe.remove();form.remove()},100);
      if(error)reject(error);else resolve(data);
    }
    function onReply(event){
      // Apps Script HTML runs on a Google sandboxed origin.
      if(!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(event.origin) &&
         event.origin!=='https://script.google.com')return;
      const msg=event.data;
      if(!msg||typeof msg!=='object'||msg.channel!=='FINORA_GAS_RPC_V1'||msg.requestId!==id)return;
      const result=msg.result;
      if(!result?.success){
        const e=new Error(result?.error?.message||'Request gagal.');
        if(['SIGN_IN_REQUIRED','ACCESS_DENIED'].includes(result?.error?.code)){
          sessionStorage.removeItem(FINORA_SESSION_KEY);
        }
        finish(e);return;
      }
      finish(null,result.data);
    }
    window.addEventListener('message',onReply);
    document.body.append(iframe,form);
    try{form.submit()}catch(e){finish(new Error('Gagal mengirim request Apps Script: '+e.message))}
  });
}
// Each Firebase credential is verified server-side and data is scoped to its UID.

async function finoraBoot_() {
  if (!finoraReadSession_()) {
    location.replace('index.html');
    return;
  }

  const start = performance.now();

  try {
    setStatus('Memverifikasi sesi...', 'pending');

    await finoraEnsureSession_();

    console.info(
      'Finora session:',
      Math.round(performance.now() - start),
      'ms'
    );

    setStatus('Memuat data keuangan...', 'pending');

    state.snap = await rpc('snapshotCore');
    finoraLazyInit_(state.snap);

    console.info(
      'Finora total startup:',
      Math.round(performance.now() - start),
      'ms'
    );

    if (!state.snap?.data || !state.snap?.derived) {
      throw new Error('Data dashboard tidak lengkap.');
    }

    finoraSyncIdentity_();

    setStatus(
      'Sinkron ' + state.snap.serverTime.slice(11, 16),
      ''
    );

    render();

  } catch (error) {
    console.error('Finora startup error:', error);

    setStatus('Gagal memuat', 'error');

    $('content').innerHTML = `
      <div class="empty">
        <span class="icon">⚠</span>
        <h3>Gagal memuat dashboard</h3>
        <p>${esc(error.message)}</p>
        <div class="toolbar mt-4"
             style="justify-content:center">
          <button class="btn btn-primary"
                  onclick="location.reload()">
            Coba Lagi
          </button>
          <a class="btn btn-light" href="index.html">
            Kembali ke Login
          </a>
        </div>
      </div>
    `;
  }
}


async function refresh(silent=false){if(state.busy)return;state.busy=true;setStatus('Sinkronisasi...','pending');try{state.snap=await rpc('snapshotFresh');setStatus('Sinkron '+state.snap.serverTime.slice(11,16),'');render();if(!silent)toast('Data berhasil disinkronkan')}catch(e){setStatus('Koneksi gagal','error');if(!state.snap){$('content').innerHTML=`<div class="empty"><span class="icon">⚠</span><h3>Tidak dapat memuat data</h3><p>${esc(e.message)}</p><div class="mt-4"><button class="btn btn-primary" data-task="refresh">Coba lagi</button></div></div>`;}toast(e.message,true)}finally{state.busy=false}}


async function saveAction(action, payload, modalClose = true) {
  if (state.busy) {
    throw new Error('Penyimpanan lain masih berlangsung.');
  }

  state.busy = true;
  setStatus('Menyimpan...', 'pending');

  try {
    const result = await rpc(action, payload);

    if (result?.__snapshot) {
      state.snap = result.__snapshot;
    } else {
      state.snap = await rpc('snapshotFresh');
    }
    finoraLazyInit_(state.snap);
    

    setStatus(
      'Sinkron ' + state.snap.serverTime.slice(11, 16),
      ''
    );

    if (modalClose) closeModal();

    render();

    toast(
      result?.duplicate
        ? 'Transaksi duplikat diabaikan.'
        : 'Perubahan berhasil disimpan.'
    );

    return result;

  } catch (e) {
    toast(e.message, true);
    setStatus('Perubahan gagal', 'error');
    throw e;

  } finally {
    state.busy = false;
  }
}

function metric(label,value,ic,desc='',strong=false,color=''){return `<div class="card metric hover ${strong?'strong':''}" title="${esc(label)}"><div class="metric-top"><span class="metric-title">${esc(label)}</span><span class="metric-symbol">${ic}</span></div><div class="metric-val money ${color}">${value}</div><div class="metric-desc">${desc}</div></div>`}
const cHead=(title,right='')=>`<div class="card-head"><h3>${title}</h3><small>${right}</small></div>`;
function empty(title,desc,button=''){return `<div class="empty"><span class="icon">◈</span><h3>${esc(title)}</h3><p>${esc(desc)}</p>${button?`<div class="mt-4">${button}</div>`:''}</div>`}

function progress(value,total,label=''){return `<div class="progress" title="${esc(label)}"><span style="width:${ratio(value,total)}%"></span></div>`}
function rowTransaction(t){const inc=t.type==='income',xfer=t.type==='transfer',sign=inc?'+':xfer?'⇄':'−';return `<tr><td><div class="item-title">${esc(t.description|| (xfer?'Transfer internal':fullName('Categories',t.categoryId)))}</div><div class="sub">${esc(t.merchant||fullName('Categories',t.categoryId))}</div></td><td>${esc(t.date)}</td><td><span class="chip ${inc?'good':xfer?'neutral':''}">${inc?'Income':xfer?'Transfer':'Expense'}</span></td><td>${esc(fullName('Accounts',t.accountId))}${xfer?' → '+esc(fullName('Accounts',t.toAccountId)):''}</td><td>${t.pocketId?esc(fullName('Pockets',t.pocketId)):'—'}</td><td class="text-right money ${inc?'good':xfer?'muted':'bad'}"><b>${sign} ${fmt(t.amount)}</b></td><td>${t.virtual?'<span class="chip neutral">Auto-ledger</span>':`<div class="row-actions"><button class="btn btn-light btn-sm" data-form="transaction" data-id="${esc(t.id)}">Edit</button><button class="btn btn-danger btn-sm" data-task="deleteTx" data-id="${esc(t.id)}">Hapus</button></div>`}</td></tr>`}
function transactionTable(rows,limit=12){const pageRows=limit?rows.slice((state.page-1)*limit,state.page*limit):rows;return `${rows.length?`<div class="table-wrap"><table><thead><tr><th>Aktivitas</th><th>Tanggal</th><th>Jenis</th><th>Akun</th><th>Kantong</th><th class="text-right">Jumlah</th><th>Aksi</th></tr></thead><tbody>${pageRows.map(rowTransaction).join('')}</tbody></table></div>${limit&&rows.length>limit?`<div class="strip mt-3"><small class="muted">${rows.length} transaksi • Halaman ${state.page} dari ${Math.ceil(rows.length/limit)}</small><div class="toolbar"><button class="btn btn-light btn-sm" data-task="prevPage" ${state.page===1?'disabled':''}>← Sebelumnya</button><button class="btn btn-light btn-sm" data-task="nextPage" ${state.page>=Math.ceil(rows.length/limit)?'disabled':''}>Berikutnya →</button></div></div>`:''}`:empty('Belum ada transaksi','Tambahkan pemasukan atau pengeluaran pertama Anda.',addButton('Transaksi','transaction'))}`}
function dashboard(){const f=fin(),m=f.metrics||{},s=getSummary(),pockets=Object.values(f.pockets||{}),goals=Object.values(f.goals||{}),w=(d().Settings||[]).find(x=>x.key==='dashboardWidgets')?.value||'cash,income,expense,worth';const allowed=w.split(',');let metrics=[['cash',metric('Total saldo',compact(m.cash),'◈','Gabungan semua rekening',true)],['income',metric('Pemasukan periode',compact(s.income),'↙','Berdasarkan filter periode',false,'good')],['expense',metric('Pengeluaran periode',compact(s.expense),'↗','Berdasarkan filter periode',false,'bad')],['worth',metric('Net worth',compact(m.netWorth),'◇','Kas + aset − kewajiban')]].filter(([k])=>allowed.includes(k)).map(x=>x[1]).join('');const first=(d().Accounts||[]).length===0;

  ${first?`<div class="panel-note mb-4"><b>Mulai dari akun keuangan.</b> Tambahkan rekening/dompet dan saldo awal agar seluruh modul dapat digunakan. ${addButton('Buat akun pertama','account')}</div>`:''}
  <div class="strip mb-4"><h2>Financial overview</h2><div class="toolbar">${periodControls()}${addButton('Transaksi baru','transaction')}</div></div>

  <div class="grid cols-3 section-space"><section class="card">${cHead('Money pockets',pockets.length+' kantong')}${pockets.length?pockets.slice(0,4).map(p=>`<div class="list-row"><div class="round-icon" style="color:${esc(p.color)}">◉</div><div class="grow"><b class="item-title">${esc(p.name)}</b><div class="sub">Tersedia ${fmt(p.available)}</div>${progress(p.used,p.allocated)}</div></div>`).join(''):empty('Belum ada kantong','Buat alokasi dana untuk setiap kebutuhan.',addButton('Buat kantong','pocket'))}<button class="btn btn-soft btn-sm mt-4" data-view="pockets">Lihat semua kantong →</button></section>

function accountsPage(){const arr=Object.values(fin().accounts||{});return `${pageTitle('Accounts & Wallets','Kelola rekening bank, uang tunai, dan dompet digital.',addButton('Tambah akun','account'))}<div class="grid cols-3">${arr.map(a=>`<article class="card hover"><div class="strip"><div class="round-icon">${a.type==='bank'?'▣':a.type==='cash'?'◈':'▤'}</div><span class="chip ${a.archived===true?'neutral':'good'}">${a.archived===true?'Arsip':'Aktif'}</span></div><div class="mt-3"><div class="sub">${esc(a.name)} · ${esc(a.type)}</div><h2 class="money mt-2">${fmt(a.balance)}</h2><div class="sub">Dana bebas ${fmt(a.free)} • Kantong ${fmt(a.allocated)}</div></div><div class="mt-4"><button class="btn btn-light btn-sm" data-form="account" data-id="${a.id}">Ubah akun</button></div></article>`).join('')||empty('Belum ada akun','Buat rekening pertama Anda.',addButton('Buat akun','account'))}</div><div class="panel-note mt-4">Saldo akun = saldo awal + pemasukan − pengeluaran ± transfer, penyesuaian investasi, dan transaksi utang. Dana di kantong adalah alokasi dari saldo, bukan saldo tambahan.</div>`}
function pocketsPage(){const arr=Object.values(fin().pockets||{}).filter(x=>!x.archived),sum=arr.reduce((a,p)=>a+p.available,0);return `${pageTitle('Money Pockets','Pisahkan alokasi uang ke dalam kantong tanpa menghitung ulang aset.',addButton('Buat kantong','pocket')+`<button class="btn btn-light" data-form="pocketMove">⇄ Pindah dana</button>`)}<div class="grid metrics-grid mb-4">${metric('Total dana kantong',compact(sum),'◉','Alokasi tersedia')}${metric('Jumlah kantong',String(arr.length),'▤','Kantong aktif')}${metric('Total terpakai',compact(arr.reduce((s,p)=>s+p.used,0)),'↗','Pengeluaran yang memakai kantong')}${metric('Dana belum dialokasikan',compact(Object.values(fin().accounts||{}).reduce((s,a)=>s+a.free,0)),'◇','Bisa dipindah ke kantong')}</div><div class="grid cols-3">${arr.map(p=>`<article class="card pocket-card hover"><div class="strip"><div class="pocket-color" style="background:${esc(p.color)}">${esc(p.icon)}</div><span class="chip neutral">Auto ${percent(p.autoPct)}</span></div><h3 class="mt-3">${esc(p.name)}</h3><div class="sub">${esc(fullName('Accounts',p.accountId))}</div><div class="big money">${fmt(p.available)}</div><div class="strip"><small class="sub">Terpakai ${fmt(p.used)}</small><small class="sub">${percent(ratio(p.used,p.allocated))}</small></div>${progress(p.used,p.allocated)}<div class="sub mt-3">Target ${fmt(p.target||0)} · Batas ${fmt(p.limit||0)}</div><div class="actions"><button class="btn btn-soft btn-sm" data-form="pocketMove" data-pocket="${p.id}" data-type="allocate">＋ Isi</button><button class="btn btn-light btn-sm" data-form="pocketMove" data-pocket="${p.id}" data-type="release">Tarik</button><button class="btn btn-light btn-sm" data-form="pocket" data-id="${p.id}">Edit</button></div></article>`).join('')||empty('Kantong belum dibuat','Alokasikan dana untuk kebutuhan dan target Anda.',addButton('Buat kantong','pocket'))}</div><div class="panel-note mt-4">Pengisian kantong tidak mengurangi saldo rekening atau menambah pengeluar function budgetUsed(b){return transactions().filter(t=>t.type==='expense'&&t.date>=b.startDate&&t.date<=b.endDate&&(b.scope==='overall'||(b.scope==='category'?t.categoryId===b.scopeId:t.pocketId===b.scopeId))).reduce((a,t)=>a+num(t.amount),0)}
function budgetsPage(){const arr=d().Budgets||[];return `${pageTitle('Budget Planning','Tetapkan anggaran per kategori, kantong, atau keseluruhan.',addButton('Budget baru','budget'))}<div class="grid cols-3">${arr.map(b=>{const used=budgetUsed(b),over=used>num(b.amount);return `<article class="card"><div class="strip"><h3>${esc(b.label)}</h3><span class="chip ${over?'warning': 'good'}">${over?'Overbudget':'On track'}</span></div><div class="sub mt-2">${esc(b.startDate)} — ${esc(b.endDate)}</div><h2 class="mt-3 money">${fmt(used)} <small class="sub">/ ${fmt(b.amount)}</small></h2><div class="mt-3">${progress(used,b.amount)}</div><div class="strip mt-3"><small>Sisa ${fmt(Math.max(0,b.amount-used))}</small><b>${percent(used/num(b.amount)*100)}</b></div><div class="mt-4 row-actions"><button class="btn btn-light btn-sm" data-form="budget" data-id="${b.id}">Edit</button><button class="btn btn-danger btn-sm" data-task="deleteBudget" data-id="${b.id}">Hapus</button></div></article>`}).join('')||empty('Belum ada anggaran','Atur limit pengeluaran bulanan atau khusus.',addButton('Buat budget','budget'))}</div>`}
function goalsPage(){const arr=Object.values(fin().goals||{}).filter(x=>!x.archived);return `${pageTitle('Savings Goals','Ukur kemajuan target keuangan dengan dana dari kantong terkait.',addButton('Target baru','goal'))}<div class="grid cols-3">${arr.map(g=>{let remaining=Math.max(0,num(g.target)-num(g.funded)),dt=Math.max(1,Math.ceil((parseISO(g.deadline)-parseISO(TODAY()))/(864e5*30.44)));return `<article class="card"><div class="strip"><h3>${esc(g.name)}</h3><span class="chip neutral">${esc(g.priority)}</span></div><p class="sub mt-2">Dana: ${esc(fullName('Pockets',g.pocketId))} · Deadline ${esc(g.deadline)}</p><h2 class="money mt-3">${fmt(g.funded)}</h2><div class="strip mt-3"><span class="sub">Target ${fmt(g.target)}</span><b>${percent(ratio(g.funded,g.target))}</b></div><div class="mt-2">${progress(g.funded,g.target)}</div><div class="sub mt-3">Estimasi kontribusi ${fmt(Math.ceil(remaining/dt))}/bulan (${dt} bulan)</div><div class="toolbar mt-4"><button class="btn btn-soft btn-sm" data-form="goalContribution" data-id="${g.id}">＋ Kontribusi</button><button class="btn btn-light btn-sm" data-form="goal" data-id="${g.id}">Edit</button></div></article>`}).join('')||empty('Belum ada goal','Buat kantong terlebih dahulu lalu hubungkan target dengan kantong tersebut.',addButton('Buat goal','goal'))}</div><div class="panel-note mt-4">Kontribusi tujuan adalah penandaan dana yang telah tersedia di kantong, bukan pengeluaran baru. Tidak menambah total aset atau saldo rekening.</div>`}
function investmentsPage(){const hs=Object.values(fin().holdings||{});return `${pageTitle('Investment Portfolio','Catat posisi, jual-beli, valuasi manual, dan performa unrealized/realized.',addButton('Tambah aset','investment')+`<button class="btn btn-light" data-form="trade">↗ Transaksi investasi</button>`)}<div class="grid metrics-grid mb-4">${metric('Nilai portfolio',compact(fin().metrics?.invest),'◫','Valuasi harga input manual')}${metric('Total modal posisi',compact(hs.reduce((s,x)=>s+x.cost,0)),'▥','Weighted average cost')}${metric('Unrealized P/L',compact(hs.reduce((s,x)=>s+x.unrealized,0)),'↗','Harga pasar minus modal','',hs.reduce((s,x)=>s+x.unrealized,0)>=0?'good':'bad')}${metric('Realized P/L',compact(hs.reduce((s,x)=>s+x.realized,0)),'◎','Dari transaksi penjualan')}</div><div class="grid cols-2">${chartCard('Asset allocation','chInvest','Mark-to-market')}${chartCard('Performance by asset','chPerformance','P/L belum terealisasi')}</div><section class="card section-space">${cHead('Daftar aset','Harga pasar diisi manual')}<div class="table-wrap"><table><thead><tr><th>Aset</th><th>Unit</th><th>Harga pasar</th><th>Modal posisi</th><th>Nilai pasar</th><th>Unrealized</th><th>Aksi</th></tr></thead><tbody>${hs.map(h=>`<tr><td><b>${esc(h.name)}</b><div class="sub">${esc(h.symbol)} · ${esc(h.type)}</div></td><td>${num(h.qty).toLocaleString('id-ID',{maximumFractionDigits:8})}</td><td>${fmt(h.marketPrice)}</td><td>${fmt(h.cost)}</td><td>${fmt(h.marketValue)}</td><td class="${h.unrealized>=0?'good':'bad'}">${fmt(h.unrealized)}</td><td><button class="btn btn-light btn-sm" data-form="investment" data-id="${h.id}">Harga / Edit</button></td></tr>`).join('')||'<tr><td colspan="7">Belum ada aset investasi.</td></tr>'}</tbody></table></div></section><div class="panel-note mt-4">Harga pasar diisi manual. Jika belum ditetapkan, valuasi menggunakan modal tercatat sebagai fallback (bukan harga pasar aktual). Investasi tidak menjadi pengeluaran konsumsi; cash keluar ketika membeli dan masuk ketika menjual. Kinerja historis penuh membutuhkan snapshot harga berkala.</div>`}
function debtsPage(){const arr=Object.values(fin().debts||{});return `${pageTitle('Debts & Receivables','Lacak kewajiban, piutang, pembayaran pokok, dan bunga.',addButton('Tambah utang / piutang','debt'))}<div class="grid cols-3">${arr.map(x=>`<article class="card"><div class="strip"><h3>${esc(x.party)}</h3><span class="chip ${x.kind==='receivable'?'good':'warning'}">${x.kind==='debt'?'Utang':'Piutang'}</span></div><div class="sub mt-2">Jatuh tempo ${esc(x.dueDate)} ${x.outstanding>0&&x.dueDate<TODAY()?'· Lewat jatuh tempo':''}</div><h2 class="money mt-3">${fmt(x.outstanding)}</h2><div class="sub mt-2">Pokok ${fmt(x.principal)} · Bunga ${percent(x.rate)}</div><div class="mt-3">${progress(x.principal-x.outstanding,x.principal)}</div><div class="toolbar mt-4"><button class="btn btn-soft btn-sm" data-form="debtPayment" data-id="${x.id}" ${x.outstanding<=0?'disabled':''}>Catat pembayaran</button><button class="btn btn-light btn-sm" data-form="debt" data-id="${x.id}">Edit</button></div></article>`).join('')||empty('Belum ada data utang','Catat pinjaman dan piutang berikut jadwalnya.',addButton('Tambah pinjaman','debt'))}</div><div class="panel-note mt-4">Pokok pinjaman/penagihan adalah perubahan posisi kas dan aset/kewajiban, bukan pemasukan/pengeluaran operasional. Bunga dicatat terpisah dan memengaruhi cash flow.</div>`}
function recurringPage(){const arr=d().RecurringRules||[];return `${pageTitle('Recurring Transactions','Automasi transaksi berulang menggunakan trigger Apps Script.',addButton('Jadwal baru','recurring')+`<button class="btn btn-light" data-task="runRecurring">↻ Jalankan sekarang</button>`)}<div class="panel-note mb-4">Jalankan <b>installDailyTrigger()</b> satu kali dari editor Apps Script untuk penjadwalan harian. Sistem membuat request ID unik per jadwal dan tanggal agar pemrosesan ulang tidak menggandakan transaksi.</div><section class="card">${cHead('Aturan aktif dan tertunda',arr.length+' aturan')}${arr.length?`<div class="table-wrap"><table><thead><tr><th>Aturan</th><th>Frekuensi</th><th>Jumlah</th><th>Berikutnya</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${arr.map(r=>`<tr><td><b>${esc(r.label)}</b><div class="sub">${esc(r.type)}</div></td><td>${esc(r.interval)}</td><td>${fmt(r.amount)}</td><td>${esc(r.nextDate)}</td><td><span class="chip ${r.active===true?'good':'neutral'}">${r.active===true?'Aktif':'Nonaktif'}</span></td><td><button class="btn btn-light btn-sm" data-form="recurring" data-id="${r.id}">Edit / jeda</button></td></tr>`).join('')}</tbody></table></div>`:empty('Belum ada jadwal','Buat aturan untuk gaji, langganan, atau tagihan rutin.',addButton('Buat jadwal','recurring'))}</section>`}
function monthlyRows(list){const map={};list.forEach(t=>{const key=t.date.slice(0,7);if(!map[key])map[key]={month:key,income:0,expense:0,transfer:0};map[key][t.type]=(map[key][t.type]||0)+num(t.amount)});return Object.values(map).sort((a,b)=>a.month.localeCompare(b.month))}
function calcBreakdown(){const arr=filteredTx(),income=arr.filter(x=>x.type==='income'),expenses=arr.filter(x=>x.type==='expense'),cats={};expenses.forEach(x=>cats[x.categoryId]=(cats[x.categoryId]||0)+num(x.amount));const sources={};income.forEach(x=>sources[x.categoryId]=(sources[x.categoryId]||0)+num(x.amount));return {arr,income,expenses,cats,sources,monthly:monthlyRows(arr)}}
function analyticsPage(){const {arr,monthly}=calcBreakdown();return `${pageTitle('Financial Analytics','Grafik interaktif seluruh aktivitas keuangan yang telah tercatat.',`<button class="btn btn-light" data-task="downloadCsv">⬇ Export CSV</button>`)}${filterControls({type:true,category:true})}${arr.length?`<div class="grid cols-2">${[
['Income vs Expense','chOverview'],['Monthly Cash Flow','chCashBar'],['Expense Category Distribution','chCategory'],['Income Sources','chIncomeSource'],['Budget vs Actual','chBudget'],['Pocket Allocation','chPocket'],['Investment Allocation','chInvest'],['Investment Unrealized Performance','chPerformance'],['Daily Expense Distribution','chDailyExpense'],['Top Spending Categories','chTopExpense'],['Account Balances','chAccount'],['Monthly Financial Comparison','chCompare'],['Savings Surplus Trend','chSavings'],['Goal Progress','chGoals'],['Debt Repayment Progress','chDebt'],['Spending Trend','chSpendingTrend']].map(([title,id])=>chartCard(title,id,'Data tercatat')).join('')}</div>`:empty('Belum ada data dalam periode ini','Ubah filter atau mulai tambahkan transaksi.')}<div class="panel-note mt-4">Pertumbuhan historis net worth dan performa investasi berbasis harga historis belum tersedia tanpa snapshot valuasi berkala. Grafik savings surplus menunjukkan pemasukan dikurangi pengeluaran, bukan saldo tabungan yang dipindahkan antar akun.</div>`}
function cashflowPage(){const s=getSummary(),deltas=monthlyRows(filteredTx()),finMetrics=fin().metrics||{};const inv=d().InvestmentTransactions||[],debtPays=d().DebtPayments||[],debtOrigins=d().DebtsReceivables||[];const investmentFlow=inv.filter(x=>inBounds(x.date)).reduce((z,x)=>z+(x.side==='sell'?1:-1)*(Math.round(num(x.qty)*num(x.price))+(x.side==='sell'?-1:1)*num(x.fee)),0);
const debtRepayFlow=debtPays.filter(x=>inBounds(x.date)).reduce((z,x)=>{const b=find('DebtsReceivables',x.debtId);return z+(b.kind==='debt'?-1:1)*num(x.principal)},0);
const debtOriginFlow=debtOrigins.filter(x=>x.funded===true&&inBounds(x.createdAt?.slice(0,10))).reduce((z,x)=>z+(x.kind==='debt'?1:-1)*num(x.principal),0);
const op=s.income-s.expense;return `${pageTitle('Cash Flow Analysis','Pisahkan arus operasional, investasi, dan pembiayaan.')}${filterControls({account:false,search:false})}<div class="grid metrics-grid mb-4">${metric('Operasional',compact(op),'⌁','Income − Expense')}${metric('Investasi',compact(investmentFlow),'◫','Jual-beli aset')}${metric('Pinjaman / pelunasan',compact(debtRepayFlow+debtOriginFlow),'⇄','Arus pembiayaan')}${metric('Total net flow',compact(op+investmentFlow+debtRepayFlow+debtOriginFlow),'◎','Tidak termasuk transfer internal')}</div><div class="grid cols-2">${chartCard('Monthly Cash Flow','chCashBar')}${chartCard('Cumulative Operating Surplus','chSavings')}</div><section class="card section-space">${cHead('Periode','Realisasi aktivitas')}<div class="table-wrap"><table><thead><tr><th>Periode</th><th>Pemasukan</th><th>Pengeluaran</th><th>Surplus operasional</th></tr></thead><tbody>${deltas.map(x=>`<tr><td>${esc(x.month)}</td><td class="good">${fmt(x.income)}</td><td class="bad">${fmt(x.expense)}</td><td><b>${fmt(x.income-x.expense)}</b></td></tr>`).join('')||'<tr><td colspan="4">Tidak ada transaksi</td></tr>'}</tbody></table></div></section>`}
function financialInsights(){const arr=filteredTx(),sum=getSummary(),income=sum.income,expense=sum.expense,r=income?100*(income-expense)/income:0,ratioEI=income?100*expense/income:0,goals=Object.values(fin().goals||{}),pockets=Object.values(fin().pockets||{}),debt=Object.values(fin().debts||{});const msgs=[];
if(income>0&&ratioEI>85)msgs.push(['warning','Spending ratio tinggi',`Pengeluaran mencapai ${percent(ratioEI)} dari pemasukan pada periode ini.`]);
if(income>0&&r>=20)msgs.push(['good','Savings surplus sehat',`Surplus operasional ${percent(r)} dari pemasukan periode ini.`]);
if(income===0&&expense>0)msgs.push(['warning','Belum ada pemasukan tercatat','Terdapat pengeluaran tanpa pemasukan pada periode terpilih.']);
pockets.filter(p=>p.allocated>0&&p.available/p.allocated<.15).forEach(p=>msgs.push(['warning',`Pocket ${p.name} hampir habis`,`Dana tersisa ${fmt(p.available)} dari ${fmt(p.allocated)} alokasi.`]));
pockets.filter(p=>num(p.limit)>0&&p.used>=.8*p.limit).forEach(p=>msgs.push(['warning',`Spending limit ${p.name} mendekati batas`,`Terpakai ${fmt(p.used)} dari limit ${fmt(p.limit)}.`]));
(d().Budgets||[]).filter(b=>b.startDate<=TODAY()&&b.endDate>=TODAY()&&budgetUsed(b)>=.8*num(b.amount)).forEach(b=>msgs.push(['warning',`Budget ${b.label} mendekati batas`,`${percent(budgetUsed(b)/num(b.amount)*100)} telah digunakan.`]));
goals.filter(g=>g.deadline<TODAY()&&g.funded<g.target).forEach(g=>msgs.push(['warning',`Goal ${g.name} lewat target`,`Masih kurang ${fmt(g.target-g.funded)} untuk mencapai target.`]));
debt.filter(x=>x.kind==='debt'&&x.outstanding>0&&x.dueDate<TODAY()).forEach(x=>msgs.push(['warning',`Utang ${x.party} lewat jatuh tempo`,`Sisa pokok ${fmt(x.outstanding)}.`]));
return {r,ratioEI,msgs:msgs.slice(0,12),income,expense};}
function healthPage(){const f=financialInsights(),active=Object.values(fin().pockets||{}),emergency=active.filter(p=>/darurat|emergency/i.test(p.name)).reduce((s,p)=>s+p.available,0),monthly=f.expense>0&&state.period==='month'?f.expense:monthlyRows(transactions().filter(t=>t.type==='expense')).slice(-3).reduce((s,m)=>s+m.expense,0)/3;const coverage=monthly?emergency/monthly:0,debtOpen=Object.values(fin().debts||{}).filter(x=>x.kind==='debt').reduce((s,x)=>s+x.outstanding,0);return `${pageTitle('Financial Health','Indikator dan insight rule-based dari data yang tercatat.')}${filterControls({account:false,search:false})}<div class="grid metrics-grid mb-4">${metric('Savings surplus rate',percent(f.r),'↗','(Income − Expense) ÷ Income')}${metric('Expense-to-income',percent(f.ratioEI),'⌁','Expense ÷ Income')}${metric('Emergency coverage',coverage.toFixed(1)+' bulan','♡','Kantong bernama Darurat / Emergency')}${metric('Total outstanding debt',compact(debtOpen),'▦','Pokok utang belum lunas')}</div><section class="card">${cHead('Personal finance insights','Otomatis · Rule-based')}${f.msgs.length?`<div class="grid cols-2">${f.msgs.map(([type,title,detail])=>`<div class="insight"><span class="badge-dot" style="background:${type==='good'?'#15966c':'#ed9b49'}"></span><div><b>${esc(title)}</b><p>${esc(detail)}</p></div></div>`).join('')}</div>`:empty('Belum ada peringatan','Semakin lengkap data, semakin relevan insight yang muncul.')}</section><div class="panel-note mt-4">Indikator bersifat deskriptif, bukan nasihat investasi atau rekomendasi profesional. Rasio berdasarkan periode yang dipilih dan mungkin kurang representatif bila data belum lengkap.</div>`}

// === Accessible schema-driven forms ===
function field(name, label, type = 'text', value = '', opts = {}) {
  const required = opts.required ? 'required' : '';
  const full = opts.full ? 'full' : '';
  const isRupiah = type === 'number' && /(\(Rp\)|Rupiah)/i.test(label);

  const min = !isRupiah && opts.min != null ? `min="${opts.min}"` : '';
  const step = !isRupiah && opts.step ? `step="${opts.step}"` : '';
  const max = !isRupiah && opts.max ? `max="${opts.max}"` : '';

  if (type === 'checkbox') {
    return `<div class="field ${full}">
      <label class="strip" style="justify-content:flex-start;gap:9px">
        <input type="checkbox" name="${name}" value="true"
        ${value === true || value === 'true' ? 'checked' : ''}
        style="width:auto"> ${esc(label)}
      </label>
      ${opts.help ? `<div class="helper">${esc(opts.help)}</div>` : ''}
    </div>`;
  }

  if (type === 'select') {
    return `<div class="field ${full}" id="field_${name}">
      <label for="f_${name}">${esc(label)}</label>
      <select id="f_${name}" name="${name}" ${required}>
        ${(opts.items || []).map(o => `
          <option value="${esc(o.value)}"
          ${String(o.value) === String(value) ? 'selected' : ''}
          ${o.kind ? `data-kind="${esc(o.kind)}"` : ''}>
            ${esc(o.label)}
          </option>
        `).join('')}
      </select>
    </div>`;
  }

  if (type === 'textarea') {
    return `<div class="field ${full}">
      <label for="f_${name}">${esc(label)}</label>
      <textarea id="f_${name}" name="${name}" ${required}>${esc(value)}</textarea>
    </div>`;
  }

  const shownValue = isRupiah
    ? String(value ?? '').replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.')
    : value;

  return `<div class="field ${full}" id="field_${name}">
    <label for="f_${name}">${esc(label)}</label>
    <input
      id="f_${name}"
      name="${name}"
      type="${isRupiah ? 'text' : type}"
      value="${esc(shownValue)}"
      ${isRupiah ? 'inputmode="numeric" data-rupiah="1"' : ''}
      ${required} ${min} ${step} ${max}
      ${opts.placeholder ? `placeholder="${esc(opts.placeholder)}"` : ''}
    >
    ${opts.help ? `<div class="helper">${esc(opts.help)}</div>` : ''}
  </div>`;
}

const normalizeMerchant = s =>
  String(s || '')
    .toLowerCase()
    .normalize('NFKC')
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

/* =========================================
   SMART CATEGORIZATION
   ========================================= */

function smartCategory(kind, merchant, description) {
  const key = normalizeMerchant(merchant || description);

  if (key.length < 3 || kind === 'transfer') return null;

  const votes = new Map();

  // Batasi pencarian untuk menjaga input tetap responsif.
  const history = (d().Transactions || []).slice(-800);

  for (const tx of history) {
    if (
      tx.deleted === true ||
      tx.deleted === 'true' ||
      tx.type !== kind ||
      !tx.categoryId
    ) continue;

    const old = normalizeMerchant(
      tx.merchant || tx.description
    );

    if (!old) continue;

    const exact = old === key;
    const similar =
      old.length >= 4 &&
      key.length >= 4 &&
      (old.includes(key) || key.includes(old));

    if (!exact && !similar) continue;

    const category = (d().Categories || []).find(
      c => c.id === tx.categoryId && c.kind === kind
    );

    if (!category) continue;

    votes.set(
      category.id,
      (votes.get(category.id) || 0) + (exact ? 3 : 1)
    );
  }

  const best = [...votes.entries()]
    .sort((a, b) => b[1] - a[1])[0];

  return best ? { id: best[0], score: best[1] } : null;
}

function smartUpdate(form) {
  const kind = form.elements.type?.value || 'expense';
  const merchant = form.elements.merchant?.value || '';
  const description = form.elements.description?.value || '';
  const select = form.elements.categoryId;
  const hint = form.querySelector('[data-smart-hint]');

  if (!select || select.dataset.manual === '1') return;

  const suggestion = smartCategory(kind, merchant, description);

  if (
    suggestion &&
    [...select.options].some(
      o => o.value === suggestion.id && !o.disabled
    )
  ) {
    select.value = suggestion.id;
    select.dataset.auto = suggestion.id;

    if (hint) {
      hint.textContent =
        'Saran dari riwayat: ' +
        fullName('Categories', suggestion.id) +
        ' — dapat diubah manual.';
    }
  } else {
    if (select.dataset.auto === select.value) {
      select.value = '';
    }

    delete select.dataset.auto;

    if (hint) {
      hint.textContent = 'Kategori bisa dipilih manual.';
    }
  }
}

function quickUpdate() {
  const form = $('quickForm');
  if (!form) return;

  const type = form.elements.type.value;
  const account = form.elements.accountId.value;
  const category = form.elements.categoryId;
  const pocket = form.elements.pocketId;

  for (const option of category.options) {
    if (!option.value) continue;

    option.hidden = option.disabled =
      option.dataset.kind !== type;
  }

  if (category.selectedOptions[0]?.disabled) {
    category.value = '';
    category.dataset.manual = '0';
  }

  for (const option of pocket.options) {
    if (!option.value) continue;

    const p = find('Pockets', option.value);

    option.hidden = option.disabled =
      type !== 'expense' || p.accountId !== account;
  }

  if (pocket.selectedOptions[0]?.disabled) {
    pocket.value = '';
  }

  const pocketField = form.querySelector('#field_pocketId');

  if (pocketField) {
    pocketField.hidden = type !== 'expense';
  }

  smartUpdate(form);
}

/* =========================================
   FINANCIAL CALENDAR
   ========================================= */

function nextCalendarRecurringDate(iso, interval) {
  const [y, m, day] = iso.split('-').map(Number);
  const date = new Date(Date.UTC(y, m - 1, day));

  if (interval === 'daily') {
    date.setUTCDate(date.getUTCDate() + 1);
  } else if (interval === 'weekly') {
    date.setUTCDate(date.getUTCDate() + 7);
  } else if (interval === 'monthly' || interval === 'yearly') {
    const months = interval === 'monthly' ? 1 : 12;
    const first = new Date(Date.UTC(y, m - 1 + months, 1));
    const last = new Date(Date.UTC(
      first.getUTCFullYear(),
      first.getUTCMonth() + 1,
      0
    )).getUTCDate();

    first.setUTCDate(Math.min(day, last));
    return first.toISOString().slice(0, 10);
  } else {
    return null;
  }

  return date.toISOString().slice(0, 10);
}

function calendarPage() {
  const ym = calMonth || TODAY().slice(0, 7);
  const [year, month] = ym.split('-').map(Number);

  const firstDay = new Date(year, month - 1, 1).getDay();
  const padding = (firstDay + 6) % 7;
  const totalDays = new Date(year, month, 0).getDate();

  const cells = Array.from({
    length: Math.ceil((padding + totalDays) / 7) * 7
  }, (_, i) => i - padding + 1);

  const actual = transactions().filter(t =>
    t.date.startsWith(ym) &&
    ['income', 'expense'].includes(t.type)
  );

  const daily = new Map();

  for (const tx of actual) {
    const row = daily.get(tx.date) || {
      income: 0,
      expense: 0,
      rows: []
    };

    row[tx.type] += num(tx.amount);
    row.rows.push(tx);
    daily.set(tx.date, row);
  }

  // Jadwal proyeksi, tidak dihitung sebagai transaksi aktual.
  const planned = new Map();

  for (const rule of (d().RecurringRules || [])) {
    if (
      rule.active === false ||
      rule.active === 'false' ||
      rule.active === '' ||
      !rule.nextDate
    ) continue;

    let date = String(rule.nextDate);

    for (let i = 0; i < 45; i++) {
      if (date > ym + '-31') break;

      if (date.startsWith(ym)) {
        const arr = planned.get(date) || [];
        arr.push(rule);
        planned.set(date, arr);
      }

      const next = nextCalendarRecurringDate(
        date,
        rule.interval
      );

      if (!next || next <= date) break;
      date = next;
    }
  }

  const selected = calDay.startsWith(ym)
    ? calDay
    : ym + '-' + String(
        Math.min(new Date().getDate(), totalDays)
      ).padStart(2, '0');

  const selectedData = daily.get(selected) || {
    income: 0,
    expense: 0,
    rows: []
  };

  const selectedRules = planned.get(selected) || [];

  const income = [...daily.values()]
    .reduce((s, x) => s + x.income, 0);

  const expense = [...daily.values()]
    .reduce((s, x) => s + x.expense, 0);

  const monthLabel = new Date(year, month - 1, 1)
    .toLocaleDateString('id-ID', {
      month: 'long',
      year: 'numeric'
    });

  return pageTitle(
    'Financial Calendar',
    'Pantau transaksi aktual dan jadwal keuangan.',
    `<button class="btn btn-primary" data-finora="quick">
      ＋ Quick Add
    </button>`
  ) +

  `<div class="grid cols-3 mb-4">
    ${metric('Pemasukan', fmt(income), '↙')}
    ${metric('Pengeluaran', fmt(expense), '↗')}
    ${metric('Selisih', fmt(income - expense), '◇')}
  </div>

  <section class="card">
    <div class="strip mb-4">
      <div class="toolbar">
        <button class="btn btn-light" data-finora="calPrev">
          ←
        </button>
        <b>${esc(monthLabel)}</b>
        <button class="btn btn-light" data-finora="calNext">
          →
        </button>
      </div>

      <button class="btn btn-light btn-sm"
        data-finora="calToday">
        Bulan ini
      </button>
    </div>

    <div class="finora-calendar">
      ${['Sen','Sel','Rab','Kam','Jum','Sab','Min']
        .map(day => `<b class="cal-week">${day}</b>`)
        .join('')}

      ${cells.map(n => {
        if (n < 1 || n > totalDays) {
          return '<span class="cal-cell cal-out"></span>';
        }

        const date = ym + '-' + String(n).padStart(2, '0');
        const summary = daily.get(date);
        const upcoming = planned.get(date) || [];

        return `
          <button class="cal-cell
            ${selected === date ? 'cal-selected' : ''}"
            data-finora="calDay"
            data-day="${date}">

            <b>${n}</b>

            ${summary?.income
              ? `<small class="good">
                  +${compact(summary.income)}
                 </small>`
              : ''}

            ${summary?.expense
              ? `<small class="bad">
                  −${compact(summary.expense)}
                 </small>`
              : ''}

            ${upcoming.length
              ? `<small class="muted">
                  ◷ ${upcoming.length} jadwal
                 </small>`
              : ''}
          </button>
        `;
      }).join('')}
    </div>
  </section>

  <section class="card section-space">
    ${cHead(
      'Aktivitas ' + selected,
      'Transaksi aktual dan jadwal mendatang'
    )}

    <div class="strip">
      <span>Pemasukan ${fmt(selectedData.income)}</span>
      <span>Pengeluaran ${fmt(selectedData.expense)}</span>
    </div>

    ${selectedData.rows.map(t => `
      <div class="list-row">
        <div class="grow">
          <b>${esc(t.description || t.merchant || t.type)}</b>
          <p class="sub">
            ${esc(fullName('Accounts', t.accountId))}
          </p>
        </div>

        <strong class="${t.type === 'income' ? 'good' : 'bad'}">
          ${fmt(t.amount)}
        </strong>
      </div>
    `).join('') ||
      '<p class="sub mt-3">Tidak ada transaksi tercatat.</p>'}

    ${selectedRules.map(rule => `
      <div class="list-row">
        <span>
          ◷ ${esc(rule.label)}
          <small class="sub">(jadwal, belum tercatat)</small>
        </span>
        <b>${fmt(rule.amount)}</b>
      </div>
    `).join('')}
  </section>`;
}

document.addEventListener('click', async e => {
  const button = e.target.closest('[data-finora]');
  if (!button) return;

  e.preventDefault();
  e.stopPropagation();

  const action = button.dataset.finora;

  if (action === 'quick') {
    openQuickAdd();
  }

  else if (action === 'closeQuick') {
    closeModal();
  }

  else if (action === 'saveQuickTemplate') {
    await storeQuickTemplate();
  }

  else if (action === 'useTemplate') {
    openQuickAdd(button.dataset.id);
  }

  else if (action === 'deleteTemplate') {
    if (!confirm('Hapus template ini?')) return;

    try {
      await persistTemplates(
        templateList().filter(
          t => t.id !== button.dataset.id
        )
      );
    } catch (err) {
      toast(err.message, true);
    }
  }

  else if (action === 'makeHistoryTemplate') {
    const tx = find('Transactions', button.dataset.id);
    if (!tx.id) return;

    const name = (
      tx.description ||
      tx.merchant ||
      'Template transaksi'
    ).slice(0, 80);

    const template = {
      id: 'tpl_' + browserNonce(),
      name,
      type: tx.type,
      amount: Number(tx.amount),
      accountId: tx.accountId,
      categoryId: tx.categoryId,
      pocketId: tx.pocketId,
      merchant: tx.merchant || '',
      description: tx.description || ''
    };

    try {
      await persistTemplates([
        ...templateList(),
        template
      ]);
    } catch (err) {
      toast(err.message, true);
    }
  }

  else if (
    ['calPrev', 'calNext', 'calToday', 'calDay']
      .includes(action)
  ) {
    const ym = calMonth || TODAY().slice(0, 7);

    if (action === 'calToday') {
      calMonth = TODAY().slice(0, 7);
      calDay = TODAY();
    }

    else if (action === 'calDay') {
      calDay = button.dataset.day;
    }

    else {
      const [year, month] = ym.split('-').map(Number);

      const date = new Date(
        year,
        month - 1 + (action === 'calNext' ? 1 : -1),
        1
      );

      calMonth = dateISO(date).slice(0, 7);
      calDay = '';
    }

    render();
  }
}, true);

function V3pickOCR(text){
 const lines=String(text).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const amountValue=s=>{let x=s.replace(/[^\d,.]/g,'');if(!x)return 0;const dot=x.lastIndexOf('.'),comma=x.lastIndexOf(','),sep=Math.max(dot,comma);
  if(sep>=0&&x.length-sep-1===2&&/\d{1,3}[.,]\d{2}$/.test(x))x=x.slice(0,sep);
  const n=Number(x.replace(/\D/g,''));return Number.isSafeInteger(n)?n:0;};
 const matches=[];
 for(const [i,line] of lines.entries()){
  const list=line.match(/(?:Rp\s*)?\d[\d.,]{2,}/gi)||[];
  for(const token of list){const a=amountValue(token);if(a>0&&a<=1e12){const score=/(grand\s*total|total\s*bayar|jumlah\s*bayar|total|jumlah|amount\s*due|tagihan)/i.test(line)?100:0;matches.push({a,score:score+i/100})}}
 }
 matches.sort((a,b)=>b.score-a.score||b.a-a.a);
 const dateMatch=text.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](20\d{2})\b/);
 let date=TODAY();if(dateMatch){const iso=`${dateMatch[3]}-${dateMatch[2].padStart(2,'0')}-${dateMatch[1].padStart(2,'0')}`;if(dateISO(parseISO(iso))===iso)date=iso;}
 return {amount:matches[0]?.a||'',merchant:(lines.find(x=>/[A-Za-z]{3}/.test(x)&&!/(tanggal|kasir|struk|tanggal|invoice)/i.test(x))||'').slice(0,100),date};
}
async function V3loadOCR(){if(window.Tesseract)return;
 await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js';script.async=true;script.onload=resolve;script.onerror=()=>reject(new Error('Gagal memuat library OCR. Periksa koneksi internet.'));document.head.append(script)});
 if(!window.Tesseract)throw new Error('Library OCR tidak tersedia');
}
async function V3scan(){const el=$('v3ScanStatus');const set=x=>{if($('v3ScanStatus'))$('v3ScanStatus').textContent=x};
 const file=$('v3ScanFile')?.files?.[0]||V3.scanFile;if(!file){toast('Pilih foto struk terlebih dahulu.',true);return}
 if(!file.type.startsWith('image/')||file.size>8*1024*1024){toast('Gunakan foto JPG/PNG/WebP maksimal 8 MB.',true);return}
 V3.scanFile=file;set('Memuat OCR (pertama kali bisa lebih lama)...');let worker;
 try{await V3loadOCR();worker=await Tesseract.createWorker('eng');set('Membaca teks struk...');const result=await worker.recognize(file);V3.ocrText=result.data.text||'';
  V3.scanResult=V3pickOCR(V3.ocrText);render();toast('OCR selesai. Periksa tanggal, merchant, dan nominal.');

}
async function V3prepareFile(file){
 if(!file)throw new Error('Pilih file.');
 if(file.type==='application/pdf'){
  if(file.size>280000)throw new Error('PDF maksimal 280 KB. Kompres PDF terlebih dahulu.');
  return V3fileEncode(file,file.name);
 }
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Format file tidak didukung.');
 if(file.size>8*1024*1024)throw new Error('Foto maksimal 8 MB sebelum kompresi.');
 const bitmap=await createImageBitmap(file),canvas=document.createElement('canvas');
 let max=1400;let compressed;
 for(let i=0;i<6;i++){
  const ratio=Math.min(1,max/Math.max(bitmap.width,bitmap.height));canvas.width=Math.round(bitmap.width*ratio);canvas.height=Math.round(bitmap.height*ratio);
  const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
  compressed=await new Promise(r=>canvas.toBlob(r,'image/jpeg',Math.max(.4,.78-i*.07)));
  if(compressed&&compressed.size<=270000)break;max=Math.floor(max*.78);
 }
 bitmap.close?.();canvas.width=canvas.height=0;
 if(!compressed||compressed.size>280000)throw new Error('Tidak dapat mengompresi struk di bawah 280 KB.');
 return V3fileEncode(compressed,file.name.replace(/\.[^.]+$/,'.jpg'));
}
async function V3fileEncode(file,fileName){const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('Gagal membaca file'));reader.readAsDataURL(file)});
 return {fileName,mimeType:file.type,base64};
}

  const received=claims.reduce((s,x)=>s+V4paidClaim(x.id),0);
  const overdue=open.filter(x=>V4remainingClaim(x)>0&&x.expectedDate<TODAY());
  return pageTitle('Refund & Cashback Tracker','Pantau pengembalian dana, cashback, dan reimbursement tanpa menghitung saldo dua kali.',
    '<button class="btn btn-primary" data-v4="newClaim">＋ Buat klaim</button>')+
    `<div class="grid cols-3 mb-4">

    ${metric('Sudah diterima',fmt(received),'↙','Terhubung ke transaksi pemasukan')}

      return `<section class="card v4-card section-space"><div class="strip"><div><h3>${esc(c.title)}</h3><div class="sub">${esc(V4kindName(c.kind))} • ${esc(c.merchant||'Tidak ada merchant')} • Estimasi ${esc(c.expectedDate)}</div></div>

        <div class="grid cols-3 mt-3">${V4sub('Nilai klaim',fmt(c.amount))}${V4sub('Diterima',fmt(paid))}${V4sub('Sisa',fmt(left))}</div>

function V4riskData(){
  const now=parseISO(TODAY()),past=dateISO(new Date(now.getFullYear(),now.getMonth(),now.getDate()-89));
  const last90=transactions().filter(x=>x.date>=past&&x.date<=TODAY());
  const expense=last90.filter(t=>t.type==='expense').reduce((s,t)=>s+num(t.amount),0);
  const income=last90.filter(t=>t.type==='income').reduce((s,t)=>s+num(t.amount),0);
  const monthSpend=expense/3,monthIncome=income/3;
  const accounts=Object.values(fin().accounts||{});
  const cash=accounts.reduce((sum,a)=>sum+num(a.balance),0);
  const free=accounts.reduce((sum,a)=>sum+num(a.free),0);
  const coverage=monthSpend?cash/monthSpend:null;
  const next30=dateISO(new Date(now.getFullYear(),now.getMonth(),now.getDate()+30));
  const dueBills=V4rows('Subscriptions').filter(x=>V4.active(x.active)&&x.nextDueDate>=TODAY()&&x.nextDueDate<=next30);
  const dueRules=V4rows('RecurringRules').filter(x=>V4.active(x.active)&&x.nextDate>=TODAY()&&x.nextDate<=next30);
  const dueDebts=Object.values(fin().debts||{}).filter(x=>x.kind==='debt'&&num(x.outstanding)>0&&x.dueDate<=next30);
  const scheduled=dueBills.reduce((sum,x)=>sum+num(x.amount),0)+dueRules.filter(x=>x.type==='expense').reduce((sum,x)=>sum+num(x.amount),0)+dueDebts.reduce((sum,x)=>sum+num(x.outstanding),0);
  const scheduledIncome=dueRules.filter(x=>x.type==='income').reduce((sum,x)=>sum+num(x.amount),0);
  const projected=cash+scheduledIncome-scheduled;
  const holdings=Object.values(fin().holdings||{}).filter(x=>num(x.marketValue)>0);
  const invested=holdings.reduce((sum,h)=>sum+num(h.marketValue),0);
  const top=holdings.slice().sort((a,b)=>num(b.marketValue)-num(a.marketValue))[0];
  const concentration=top&&invested?num(top.marketValue)/invested:null;
  const recentInstallments=V4rows('DebtPayments').filter(x=>x.date>=past&&x.date<=TODAY()&&find('DebtsReceivables',x.debtId).kind==='debt').reduce((sum,x)=>sum+num(x.principal)+num(x.interest),0)/3;
  const installmentRatio=monthIncome&&recentInstallments?recentInstallments/monthIncome:null;
  const overdueDebt=dueDebts.filter(x=>x.dueDate<TODAY());
  const flags=[];
  if(coverage!==null&&coverage<3)flags.push({level:coverage<1?'high':'medium',title:'Likuiditas rendah',desc:`Cadangan kas menutupi sekitar ${coverage.toFixed(1)} bulan pengeluaran historis.`});
  if(free<scheduled)flags.push({level:'high',title:'Dana bebas tidak cukup',desc:`Dana bebas ${fmt(free)} lebih kecil dari tagihan dan kewajiban terjadwal ${fmt(scheduled)} dalam 30 hari (estimasi konservatif).`});
  if(projected<0)flags.push({level:'high',title:'Potensi saldo negatif',desc:`Simulasi tagihan dan pemasukan terjadwal menghasilkan ${fmt(projected)}. Jadwal dapat tumpang tindih.`});
  if(concentration!==null&&concentration>=0.6)flags.push({level:'medium',title:'Konsentrasi investasi tinggi',desc:`${top.name} menyumbang ${percent(concentration*100)} dari portofolio bernilai tercatat.`});
  if(installmentRatio!==null&&installmentRatio>=0.35)flags.push({level:'medium',title:'Beban cicilan tinggi',desc:`Cicilan aktual rata-rata 90 hari ${percent(installmentRatio*100)} dari pendapatan rata-rata bulanan.`});
  if(overdueDebt.length)flags.push({level:'high',title:'Utang lewat jatuh tempo',desc:`Terdapat ${overdueDebt.length} kewajiban yang lewat jatuh tempo berdasarkan data yang diisi.`});
  return {cash,free,monthSpend,monthIncome,coverage,invested,top,concentration,recentInstallments,installmentRatio,scheduled,scheduledIncome,projected,flags,count:last90.length};
}

 const r=V4riskData();return pageTitle('Financial Risk Monitoring','Pemantauan rule-based atas likuiditas, cicilan, aset, dan jadwal pengeluaran.',

}
function V4parseShares(text){
  const rows=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!rows.length||rows.length>25)throw new Error('Masukkan 1–25 peserta.');
  return rows.map(row=>{
    const pieces=row.split('|');if(pieces.length!==2)throw new Error('Format peserta: Nama | 150000');
    const person=pieces[0].trim(),amount=V4money(pieces[1]);
    if(!person||!amount)throw new Error('Nama dan nominal setiap peserta harus diisi.');
    return {person,amount};
  });
}
// Event delegation: isolated from existing V2/V3 and transaction handlers.
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-v4]');if(!el)return;
  e.preventDefault();const a=el.dataset.v4,id=el.dataset.id;
  try{
    if(a==='close'){closeModal();return;}
    if(a==='newClaim')V4claimForm();
    else if(a==='editClaim')V4claimForm(id);
    else if(a==='linkRefund')V4refundLinkForm(id);
    else if(a==='cancelClaim'&&confirm('Batalkan klaim ini?'))await saveAction('cancelRefundClaim',{id},false);
    else if(a==='voidRefund'&&confirm('Batalkan tautan dana masuk? Transaksi pemasukan asli tetap ada.'))await saveAction('voidRefundReceipt',{id},false);
    else if(a==='newSplit')V4splitForm();
    else if(a==='settleShare')V4settleForm(id);
    else if(a==='voidSettlement'&&confirm('Batalkan tautan pelunasan? Transaksi asli tetap ada.'))await saveAction('voidSharedSettlement',{id},false);
    else if(a==='cancelBill'&&confirm('Batalkan split bill ini?'))await saveAction('cancelSharedBill',{id},false);
  }catch(err){toast(err.message,true)}
});
document.addEventListener('change',e=>{
 if(e.target.name==='payerType'&&e.target.closest('#v4SplitForm'))V4toggleSplitForm();
 if(e.target.name==='transactionId'&&e.target.closest('#v4SplitForm')){
  const tx=find('Transactions',e.target.value);
  if(tx.id&&num(tx.amount)){
    const amount=e.target.form.elements.total;
    if(amount){amount.value=String(tx.amount).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
  }
 }
});
document.addEventListener('submit',async e=>{
 const form=e.target;if(!['v4ClaimForm','v4RefundLinkForm','v4SplitForm','v4SettlementForm'].includes(form.id))return;
 e.preventDefault();e.stopImmediatePropagation();const button=form.querySelector('[type="submit"]');button.disabled=true;
 const p=Object.fromEntries(new FormData(form));
 try{
   if(form.id==='v4ClaimForm'){
     p.amount=V4money(p.amount);if(!p.id)delete p.id;
     await saveAction('saveRefundClaim',p);
   }else if(form.id==='v4RefundLinkForm'){
     await saveAction('linkRefundReceipt',{...p,requestId:reqId()});
   }else if(form.id==='v4SplitForm'){
     p.total=V4money(p.total);p.shares=V4parseShares(p.participants);delete p.participants;
     if(p.payerType==='other')delete p.transactionId;
     await saveAction('saveSharedBill',p);
   }else if(form.id==='v4SettlementForm'){
     await saveAction('linkSharedSettlement',{...p,requestId:reqId()});
   }
 }catch(err){button.disabled=false;}
},true);

function finoraAvatarJpeg_(file){
  return new Promise((resolve,reject)=>{
    if(file.size>4*1024*1024){reject(new Error('Foto maksimal 4 MB sebelum kompresi.'));return;}
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(url);try{
      const c=document.createElement('canvas');c.width=128;c.height=128;
      const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,128,128);
      const sc=Math.max(128/im.width,128/im.height),w=im.width*sc,h=im.height*sc;
      cx.drawImage(im,(128-w)/2,(128-h)/2,w,h);
      const data=c.toDataURL('image/jpeg',0.64);
      if(data.length>30000)throw new Error('Foto masih terlalu besar. Gunakan gambar lebih kecil.');
      resolve(data);
    }catch(e){reject(e);}};
    im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Foto tidak dapat dibaca.'));};
    im.src=url;
  });
}

/* =========================================
   FINORA — LAZY DATA LOADING FRONTEND
   ========================================= */

const FINORA_LAZY_VIEWS = Object.freeze({
  analytics: ['Budgets'],
  budgets: ['Budgets'],
  health: ['Budgets'],
  reports: ['Budgets'],
  data: ['AuditLogs'],

  recurring: ['RecurringRules'],
  calendar: ['RecurringRules'],

  forecast: ['RecurringRules', 'Subscriptions'],
  risk: ['RecurringRules', 'Subscriptions'],

  bills: ['Subscriptions', 'BillPayments'],
  receipts: ['ReceiptAttachments'],

  refunds: ['RefundClaims', 'RefundReceipts'],

  split: [
    'SharedBills',
    'SharedShares',
    'SharedSettlements'
  ]
});

const finoraLazyLoaded = new Set();
const finoraLazyPending = new Map();

// Tandai tabel yang sudah tersedia.
function finoraLazyInit_(snap) {
  finoraLazyLoaded.clear();

  const names = snap?.loadedTables ||
    Object.keys(snap?.data || {});

  names.forEach(name => finoraLazyLoaded.add(name));
}

// Cegah halaman menampilkan data parsial.
function finoraLazyGate_() {
  const view = state.view;
  const required = FINORA_LAZY_VIEWS[view] || [];

  if (required.every(name => finoraLazyLoaded.has(name))) {
    return false;
  }

  $('navigation').innerHTML = navHtml();
  $('crumb').textContent = titleFor(view);

  $('content').innerHTML = `
    <div class="pages">
      <div class="empty">
        <span class="icon">◈</span>
        <h3>Memuat ${esc(titleFor(view))}...</h3>
        <p>Mengambil data modul ini dari Google Sheets.</p>
      </div>
    </div>
  `;

  // Jangan mengirim request berulang untuk menu sama.
  if (finoraLazyPending.has(view)) return true;

  const snap = state.snap;

  const task = rpc('loadModule', { view })
    .then(result => {
      const tables = result?.tables || {};

      required.forEach(name => {
        if (!Array.isArray(tables[name])) {
          throw new Error(
            'Data ' + name + ' tidak lengkap.'
          );
        }
      });

      // Abaikan respons lama setelah sinkronisasi baru.
      if (state.snap !== snap) return;

      required.forEach(name => {
        state.snap.data[name] = tables[name];
        finoraLazyLoaded.add(name);
      });
    })
    .catch(error => {
      if (state.snap !== snap || state.view !== view) {
        return;
      }

      $('content').innerHTML = `
        <div class="pages">
          <div class="empty">
            <span class="icon">⚠</span>
            <h3>Gagal memuat modul</h3>
            <p>${esc(error.message)}</p>
            <button type="button"
              class="btn btn-primary mt-3"
              data-finora-lazy-retry>
              Coba lagi
            </button>
          </div>
        </div>
      `;
    })
    .finally(() => {
      finoraLazyPending.delete(view);

      if (
        state.snap === snap &&
        state.view === view &&
        required.every(name => finoraLazyLoaded.has(name))
      ) {
        render();
      }
    });

  finoraLazyPending.set(view, task);
  return true;
}

// Tombol ulangi jika modul gagal dimuat.
document.addEventListener('click', e => {
  if (e.target.closest('[data-finora-lazy-retry]')) {
    e.preventDefault();
    render();
  }
});
let searchTimer;
document.addEventListener('input', function (e) {
  if (!e.target.matches('input[data-rupiah]')) return;

  const input = e.target;
  const cursor = input.selectionStart ?? input.value.length;
  const digitsBeforeCursor =
    input.value.slice(0, cursor).replace(/\D/g, '').length;

  const angka = input.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
  const formatted = angka.replace(/\B(?=(\d{3})+(?!\d))/g, '.');

  input.value = formatted;

  let position = 0;
  let digitCount = 0;

  while (position < formatted.length && digitCount < digitsBeforeCursor) {
    if (/\d/.test(formatted[position])) digitCount++;
    position++;
  }

  input.setSelectionRange(position, position);
});
