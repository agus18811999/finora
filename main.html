   return pageTitle('Insurance Management','Kelola polis, manfaat perlindungan, premi, dan tanggal perpanjangan.',fpCta('Tambah Polis','policy'))+
     `<div class="fp-metrics">${fpMoney('Estimasi premi tahunan',policies.filter(x=>x.active===true||x.active==='true').reduce((s,x)=>s+annual(x),0))}${fpMoney('Total manfaat polis aktif',policies.filter(x=>x.active===true||x.active==='true').reduce((s,x)=>s+num(x.coverage),0))}${fpMoney('Premi sudah dicatat',paid.reduce((s,x)=>s+num(x.amount),0))}</div>${note}`+
     (policies.length?`<div class="grid cols-2">${policies.map(p=>`<section class="card fp-card"><div class="strip"><b>${esc(p.name)}</b>${fpStatus(p.active===true||p.active==='true')}</div><div class="sub">${esc(p.provider)} · ${esc(p.type)} · Polis ${esc(p.policyNumber||'—')}</div><div class="fp-big">${fmt(p.coverage)}</div><div class="sub">Manfaat pertanggungan · Premi ${fmt(p.premium)} / ${esc(p.interval)}</div><div class="fp-due">Jadwal premi berikutnya: <b>${fpDate(p.nextDueDate)}</b></div><div class="toolbar mt-3">${fpEdit('policy',p.id)}${fpCta('Catat Premi','premium','',p.id)}</div></section>`).join('')}</div>`:fpNoData('polis asuransi','policy'))+
     `<section class="card section-space">${cHead('Riwayat premi')}${fpTable(['Tanggal','Polis','Nominal','Aksi'],paid.slice().reverse().map(x=>`<tr><td>${fpDate(x.date)}</td><td>${esc(policies.find(p=>p.id===x.policyId)?.name||'—')}</td><td>${fmt(x.amount)}</td><td>${fpVoid('voidInsurancePremium',x.id)}</td></tr>`))||empty('Belum ada pembayaran premi','Simpan catatan premi setiap kali dibayarkan.')}</section>`;
 }
 if(view==='salary'){
   const salaries=fpRows('SalaryRecords').filter(fpActive).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
   const total=salaries.reduce((s,x)=>s+num(x.net),0),gross=salaries.reduce((s,x)=>s+num(x.gross),0);
   return pageTitle('Salary & Compensation Tracker','Catat slip gaji, tunjangan, bonus, lembur, dan potongan per periode.',fpCta('Tambah Slip Gaji','salary'))+
     `<div class="fp-metrics">${fpMoney('Total gaji bersih tercatat',total)}${fpMoney('Total pendapatan kotor',gross)}${fpMoney('Total pajak & potongan',gross-total)}</div>${note}`+
     (salaries.length?`<section class="card">${cHead('Rincian kompensasi',salaries.length+' catatan')}${fpTable(['Periode','Perusahaan','Gaji pokok','Tunjangan / Bonus / Lembur','Pajak & potongan','Gaji bersih','Aksi'],salaries.map(s=>`<tr><td>${fpDate(s.date)}</td><td>${esc(s.employer)}</td><td>${fmt(s.basic)}</td><td>${fmt(num(s.allowances)+num(s.bonus)+num(s.overtime))}</td><td>${fmt(num(s.tax)+num(s.deductions))}</td><td><b class="good">${fmt(s.net)}</b></td><td><div class="toolbar">${fpEdit('salary',s.id)}${fpVoid('voidSalary',s.id)}</div></td></tr>`))}</section>`:fpNoData('slip gaji','salary'));
 }
 return '';
}
function fpOptions_(items){return items.map(([v,label])=>({value:v,label}));}
function fpFields_(type){
 const T=TODAY();
 const date=(name,label,value=T)=>({name,label,type:'date',value,required:true});
 const money=(name,label,value=0)=>({name,label,type:'money',value,required:true});
 const text=(name,label,value='',required=true)=>({name,label,type:'text',value,required});
 const sel=(name,label,items,value)=>({name,label,type:'select',items,value:value??items[0]?.value,required:true});
 const parent=(name,label,table)=>sel(name,label,fpRows(table).map(x=>({value:x.id,label:x.name})),undefined);
 switch(type){
 case 'card':return [text('name','Nama kartu'),text('issuer','Bank / penerbit'),text('last4','4 digit terakhir', '',false),money('limit','Limit kredit'),money('openingDebt','Tagihan awal'),{name:'billingDay',label:'Tanggal cetak (1–28)',type:'number',value:1,required:true},{name:'dueDay',label:'Tanggal jatuh tempo (1–28)',type:'number',value:15,required:true},{name:'apr',label:'Bunga tahunan indikatif (%)',type:'number',value:0,required:true},sel('active','Status kartu',fpOptions_([['true','Aktif'],['false','Nonaktif']])) ,text('notes','Catatan', '',false)];
 case 'charge':return [parent('cardId','Kartu kredit','CreditCards'),date('date','Tanggal transaksi'),text('merchant','Merchant'),text('description','Deskripsi','',false),money('amount','Nominal pembelanjaan')];
 case 'cardPayment':return [parent('cardId','Kartu kredit','CreditCards'),date('date','Tanggal pembayaran'),money('amount','Pembayaran tagihan'),text('notes','Catatan','',false)];
 case 'plan':return [text('name','Nama cicilan / produk'),text('provider','Penyedia PayLater'),money('principal','Nilai pembiayaan'),money('fees','Total biaya dan bunga'),{name:'tenor',label:'Tenor (bulan)',type:'number',value:6,required:true},date('firstDueDate','Jatuh tempo pertama'),sel('status','Status',fpOptions_([['active','Aktif'],['completed','Selesai'],['canceled','Dibatalkan']])),text('notes','Catatan','',false)];
 case 'planPayment':return [parent('planId','Paket cicilan','PayLaterPlans'),date('date','Tanggal pembayaran'),money('amount','Jumlah pembayaran'),text('notes','Catatan','',false)];
 case 'policy':return [text('name','Nama polis'),text('provider','Perusahaan asuransi'),sel('type','Jenis asuransi',fpOptions_([['health','Kesehatan'],['life','Jiwa'],['vehicle','Kendaraan'],['property','Properti'],['other','Lainnya']])),text('policyNumber','Nomor polis','',false),money('coverage','Nilai manfaat perlindungan'),money('premium','Premi per periode'),sel('interval','Frekuensi premi',fpOptions_([['monthly','Bulanan'],['quarterly','Triwulanan'],['semiannual','Semesteran'],['yearly','Tahunan']])),date('nextDueDate','Jatuh tempo berikutnya'),sel('active','Status polis',fpOptions_([['true','Aktif'],['false','Tidak aktif']])),text('notes','Catatan','',false)];
 case 'premium':return [parent('policyId','Polis asuransi','InsurancePolicies'),date('date','Tanggal pembayaran'),money('amount','Premi dibayar'),text('notes','Catatan','',false)];
 case 'salary':return [text('employer','Nama perusahaan'),date('date','Tanggal gajian'),money('basic','Gaji pokok'),money('allowances','Tunjangan'),money('bonus','Bonus'),money('overtime','Lembur'),money('tax','Pajak / PPh'),money('deductions','Potongan lainnya'),text('notes','Keterangan','',false)];
 }
 return [];
}
const FP_TABLE_FOR_FORM = Object.freeze({card:'CreditCards',plan:'PayLaterPlans',policy:'InsurancePolicies',salary:'SalaryRecords'});
function fpOpenForm_(kind,id='',preselected=''){
 if(!FP_ACTIONS[kind])return;
 const table=FP_TABLE_FOR_FORM[kind];
 const old=id&&table?fpRows(table).find(r=>r.id===id):null;
 const fields=fpFields_(kind);
 const refName={charge:'cardId',cardPayment:'cardId',planPayment:'planId',premium:'policyId'}[kind];
 if(refName&&preselected){const field=fields.find(f=>f.name===refName);if(field)field.value=preselected;}
 if(fields.some(f=>f.type==='select'&&(!f.items||!f.items.length))){toast('Tambahkan data utama terlebih dahulu.',true);return;}
 const titles={card:'Kartu Kredit',charge:'Transaksi Kartu',cardPayment:'Pembayaran Kartu',plan:'PayLater / BNPL',planPayment:'Pembayaran Cicilan',policy:'Polis Asuransi',premium:'Premi Asuransi',salary:'Slip Gaji'};
 state.modal={name:'fp',kind};
 const ui=fields.map(f=>{
  const value=old?.[f.name]??f.value??'';
  const attrs=`name="${f.name}" id="fp_${f.name}" ${f.required?'required':''}`;
  if(f.type==='select')return `<div class="field"><label for="fp_${f.name}">${esc(f.label)}</label><select ${attrs}>${f.items.map(op=>`<option value="${esc(op.value)}" ${String(value)===String(op.value)?'selected':''}>${esc(op.label)}</option>`).join('')}</select></div>`;
  if(f.type==='money')return `<div class="field"><label for="fp_${f.name}">${esc(f.label)}</label><input ${attrs} type="text" inputmode="numeric" data-fp-money value="${esc(String(value).replace(/\B(?=(\d{3})+(?!\d))/g,'.'))}" placeholder="0"></div>`;
  return `<div class="field"><label for="fp_${f.name}">${esc(f.label)}</label><input ${attrs} type="${f.type}" ${f.type==='number'?'step="any" min="0"':''} value="${esc(value)}" ${f.type==='text'?'maxlength="350"':''}></div>`;
 }).join('');
 $('modalRoot').innerHTML=`<div class="modal-backdrop" id="fpBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(titles[kind])}"><header class="modal-head"><div><h2>${old?'Edit':'Tambah'} ${esc(titles[kind])}</h2><p class="sub">Tersimpan hanya di database akun Finora yang sedang login.</p></div><button type="button" class="close" data-fp-close aria-label="Tutup">×</button></header><div class="modal-body"><form id="fpForm" data-kind="${esc(kind)}"><input type="hidden" name="id" value="${esc(id)}"><input type="hidden" name="requestId" value="${esc(reqId())}"><div class="form-grid">${ui}</div><div class="fp-note mt-3">Pencatatan informasi saja; tidak otomatis menambah atau mengurangi saldo akun.</div><div class="modal-actions"><button type="button" class="btn btn-light" data-fp-close>Batal</button><button type="submit" class="btn btn-primary">Simpan</button></div></form></div></section></div>`;
 $('fpForm').querySelector('input:not([type=hidden]),select')?.focus();
}
document.addEventListener('click',e=>{
 const form=e.target.closest('[data-fp-form]');if(form){fpOpenForm_(form.dataset.fpForm,form.dataset.fpId||'',form.dataset.fpParent||'');return;}
 const v=e.target.closest('[data-fp-void]');if(v){if(!confirm('Batalkan catatan ini? Riwayat tetap disimpan dan saldo rekening tidak berubah.'))return;saveAction(v.dataset.fpVoid,{id:v.dataset.fpId},false).catch(()=>{});return;}
 if(e.target.closest('[data-fp-close]')||e.target.id==='fpBackdrop'){closeModal();}
});
document.addEventListener('input',e=>{
 if(!e.target.matches('#fpForm [data-fp-money]'))return;
 const el=e.target,prior=el.value.slice(0,el.selectionStart??el.value.length).replace(/\D/g,'').length;
 const digits=el.value.replace(/\D/g,'');el.value=digits.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
 let pos=0,seen=0;while(pos<el.value.length&&seen<prior){if(/\d/.test(el.value[pos]))seen++;pos++;}el.setSelectionRange(pos,pos);
});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='fpForm')return;
 e.preventDefault();e.stopImmediatePropagation();
 const form=e.target,p=Object.fromEntries(new FormData(form)),kind=form.dataset.kind;
 if(!p.id)delete p.id;
 form.querySelectorAll('[data-fp-money]').forEach(el=>p[el.name]=el.value.replace(/\D/g,''));
 const btn=form.querySelector('[type=submit]');btn.disabled=true;
 try{await saveAction(FP_ACTIONS[kind],p);}catch(err){btn.disabled=false;}
},true);

</script>
